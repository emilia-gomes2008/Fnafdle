<!DOCTYPE html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FNAFdle Reborn</title>
  <link rel="icon" type="icon/png" href="../assets/images/default.png">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/image.css" />

</head>

<body>

  <div class="fnaf-header">
    <div class="fnaf-title">
      <img src="../assets/images/title/fnafdlereborn.png" alt="Fnafdle" />
    </div>
    <div class="fnaf-subtitle">Guess the animatronic</div>
  </div>

  <!-- ===== IMAGE MODE SCREEN ===== -->
  <div class="container" id="image-screen" style="display:none;">

    <div class="mode-badge-row">
      <span class="mode-badge">🔍 Image Mode</span>
      <button class="back-btn" onclick="goHome()">← Modos</button>
    </div>

    <div class="image-mode-hint-row">
      <div class="attempts-left" id="img-attempts-left"></div>
    </div>

    <div class="mystery-image-wrap">
      <div class="mystery-image-container" id="mystery-image-container">
        <img id="mystery-img" src="" alt="?" />
        <div class="mystery-overlay" id="mystery-overlay"></div>
      </div>
      <div id="img-hint-area" style="display:none; text-align:center; margin-top:0.6rem;">
        <button onclick="useImageHint()" id="img-hint-btn">💡 Use Hint (first letter)</button>
        <div id="img-hint-text" style="margin-top:6px; color:var(--yellow-text); font-size:0.9rem; letter-spacing:2px;"></div>
      </div>
    </div>

    <div class="search-area" id="img-search-area">
      <input class="search-input" id="img-search-input" placeholder="Write an animatronic..." autocomplete="off" />
      <div class="dropdown" id="img-dropdown" style="display:none;"></div>
    </div>

    <div id="img-guesses-list"></div>

    <div class="result-banner" id="img-result-banner">
      <div class="result-title" id="img-result-title"></div>
      <div class="result-content">
        <div id="img-result-char-container"></div>
        <p class="result-msg" id="img-result-msg"></p>
      </div>
      <div class="result-buttons">
        <button onclick="initImageMode()">Play Again</button>
        <button onclick="goHome()" style="margin-left:10px; background:var(--bg-cell); border:1px solid var(--border);">← Modos</button>
      </div>
    </div>

  </div>


  <script src="../../../backend/src/db/database.js"></script>
  <script src="../../../backend/src/db/books_database.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/image.js"></script>
</body>

</html>
