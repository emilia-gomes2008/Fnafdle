<!DOCTYPE html>

<head>
  <script>
    // Set base path and clean URL: Hide /frontend/dist/pages/ in address bar
    (function() {
      var base = document.createElement('base');
      base.href = window.location.protocol + '//' + window.location.host + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
      document.head.appendChild(base);

      if (window.location.pathname.includes('/frontend/dist/pages/')) {
        var cleanPath = window.location.pathname.replace('/frontend/dist/pages/', '/');
        window.history.replaceState(null, '', cleanPath + window.location.search);
      }
    })();
  </script>

  <title>FNAFdle Reborn - Book Guessing</title>
  <link rel="icon" type="icon/png" href="../assets/images/default.png">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/book.css" />

</head>

<body>

  <div class="fnaf-header">
    <div class="fnaf-title">
      <img src="../assets/images/title/fnafdlereborn.png" alt="Fnafdle" />
    </div>
    <div class="fnaf-subtitle">Book Guessing</div>
  </div>


  <!-- ===== BOOK MODE SCREEN ===== -->
  <div class="container" id="book-screen" style="display:none;">

    <div class="mode-badge-row">
      <span class="mode-badge" id="book-mode-badge"></span>
      <div id="streak-widget" class="streak-widget" style="display:none">
        <div class="streak-item"><span class="streak-label">🔥 Streak</span><span class="streak-num" id="streak-current">0</span></div>
        <div class="streak-divider"></div>
        <div class="streak-item"><span class="streak-label">Best</span><span class="streak-num" id="streak-best">0</span></div>
      </div>
      <button class="back-btn" onclick="goHome()">← Modes</button>
    </div>

    <div class="search-area" id="book-search-area">
      <input class="search-input" id="book-search-input" placeholder="Write a book title..." autocomplete="off" />
      <div class="dropdown" id="book-dropdown" style="display:none;"></div>
    </div>

    <div class="attempts-left" id="book-attempts-left"></div>
    
    <div class="table-wrapper">
      <div class="book-table-header">
        <div class="col-label">Cover</div>
        <div class="col-label">Title</div>
        <div class="col-label">Series</div>
        <div class="col-label">Year</div>
        <div class="col-label">No.</div>
      </div>
      <div id="book-guesses-container"></div>
    </div>

    <div class="result-banner" id="book-result-banner">
      <div class="result-title" id="book-result-title"></div>
      <div class="result-content">
        <div id="book-result-img-container"></div>
        <p class="result-msg" id="book-result-msg"></p>
      </div>
      <div class="result-buttons">
        <button id="book-next-btn" style="display:none" onclick="window.location.href=this.dataset.href">▶ Next</button>
        <button id="book-daily-stats-btn" onclick="showStatsModal('daily')">📊 Daily Stats</button>
        <button id="book-play-switch-btn" style="display:none"></button>
        <button id="book-endless-stats-btn" onclick="showStatsModal('endless')">📊 Endless Stats</button>
        <button class="btn-modes" onclick="goHome()" style="background:var(--bg-cell); border:1px solid var(--border);">← Modes</button>
      </div>
    </div>

  </div>

  <script src="../../../backend/src/db/database.js"></script>
  <script src="../../../backend/src/db/books_database.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = T(el.dataset.i18n); }); });</script>
  <script src="../assets/js/core.js?v=3"></script>
  <script src="../assets/js/book.js?v=2"></script>
</body>

</html>
