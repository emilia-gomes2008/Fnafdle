<!DOCTYPE html>
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MY3EVSV9FB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag("js", new Date());

    gtag("config", "G-MY3EVSV9FB");
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FNAFdle Reborn - Classic Mode</title>
  <link rel="icon" type="icon/png" href="../assets/images/default.png">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/classic.css" />

</head>

<body>

  <div class="fnaf-header">
    <div class="fnaf-title">
      <img src="../assets/images/title/fnafdlereborn.png" alt="Fnafdle" />
    </div>
    <div class="fnaf-subtitle">Guess the animatronic</div>
  </div>

  <!-- ===== CLASSIC GAME SCREEN (Daily + Endless) ===== -->
  <div class="container" id="classic-screen" style="display:none;">

    <div class="mode-badge-row">
      <span class="mode-badge" id="classic-mode-badge"></span>
      <div id="streak-widget" class="streak-widget" style="display:none">
        <div class="streak-item"><span class="streak-label">🔥 Streak</span><span class="streak-num" id="streak-current">0</span></div>
        <div class="streak-divider"></div>
        <div class="streak-item"><span class="streak-label">Best</span><span class="streak-num" id="streak-best">0</span></div>
      </div>
      <button class="back-btn" onclick="goHome()">← Modes</button>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-dot correct"></div> Correct
      </div>
      <div class="legend-item">
        <div class="legend-dot partial"></div> Partial
      </div>
      <div class="legend-item">
        <div class="legend-dot wrong"></div> Wrong
      </div>
    </div>

    <div class="search-area" id="search-area">
      <input class="search-input" id="search-input" placeholder="Write an animatronic..." autocomplete="off" />
      <div class="dropdown" id="dropdown" style="display:none;"></div>
    </div>

    <div class="attempts-left" id="attempts-left"></div>

    <div id="hint-area" style="display:none; text-align:center; margin-bottom:0.8rem;">
      <button onclick="useHint()" id="hint-btn">💡 Use Hint (first letter)</button>
      <div id="hint-text" style="margin-top:6px; color:var(--yellow-text); font-size:0.9rem; letter-spacing:2px;"></div>
    </div>

    <div class="table-wrapper">
      <div class="table-header">
        <div class="col-label">Character</div>
        <div class="col-label">Name</div>
        <div class="col-label">Animal</div>
        <div class="col-label">Type</div>
        <div class="col-label">Color</div>
        <div class="col-label">Eye Color</div>
        <div class="col-label">Year</div>
      </div>

      <div id="guesses-container"></div>
    </div>

    <div class="result-banner" id="result-banner">
      <div class="result-title" id="result-title"></div>
      <div class="result-content">
        <div id="result-char-container"></div>
        <p class="result-msg" id="result-msg"></p>
      </div>
      <div class="result-buttons">
        <button id="play-again-btn" onclick="restartCurrent()">Play Again</button>
        <button onclick="goHome()" style="margin-left:10px; background:var(--bg-cell); border:1px solid var(--border);">← Modes</button>
      </div>
    </div>

  </div>

  <script src="../../../backend/src/db/database.js"></script>
  <script src="../../../backend/src/db/books_database.js"></script>
  <script src="../assets/js/core.js?v=2"></script>
  <script src="../assets/js/classic.js"></script>
</body>

</html>
