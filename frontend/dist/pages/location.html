  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FNAFdle Reborn - Location Guessing</title>
  <link rel="icon" type="icon/png" href="../assets/images/default.png">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Oswald:wght@400;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/global.css" />
  <link rel="stylesheet" href="../assets/css/location.css" />

</head>

<body>

  <div id="tcg-auth-bar" class="tcg-auth-bar"></div>
  <div class="fnaf-header">
    <div class="fnaf-title">
      <img src="../assets/images/title/fnafdlereborn.png" alt="Fnafdle" />
    </div>
    <div class="fnaf-subtitle" data-i18n="location.subtitle">Location Guessing</div>
  </div>

  <!-- ===== LOCATION MODE SCREEN (Daily + Endless) ===== -->
  <div class="container" id="location-screen" style="display:none;">

    <div class="mode-badge-row">
      <span class="mode-badge" id="loc-mode-badge"></span>
      <div id="streak-widget" class="streak-widget" style="display:none">
        <div class="streak-item"><span class="streak-label" data-i18n="classic.streak">🔥 Streak</span><span class="streak-num"
            id="streak-current">0</span></div>
        <div class="streak-divider"></div>
        <div class="streak-item"><span class="streak-label" data-i18n="classic.best">Best</span><span class="streak-num"
            id="streak-best">0</span></div>
      </div>
      <button class="back-btn" onclick="goHome()" data-i18n="game.backBtn">← Modes</button>
    </div>

    <div class="search-area" id="loc-search-area">
      <input class="search-input" id="loc-search-input" placeholder="Write a location..." autocomplete="off" />
      <div class="dropdown" id="loc-dropdown" style="display:none;"></div>
    </div>

    <div class="attempts-left" id="loc-attempts-left"></div>

    <div class="table-wrapper">
      <div class="location-table-header">
        <div class="col-label" data-i18n="location.colLocation">Location</div>
        <div class="col-label" data-i18n="location.colGame">Game</div>
      </div>
      <div id="loc-guesses-container"></div>
    </div>

    <div class="result-banner" id="loc-result-banner">
      <div class="result-title" id="loc-result-title"></div>
      <div class="result-content">
        <div id="loc-result-img-container"></div>
        <p class="result-msg" id="loc-result-msg"></p>
      </div>
      <div class="result-buttons">
        <button id="loc-next-btn" style="display:none" onclick="window.location.href=this.dataset.href" data-i18n="game.next">▶ Next</button>
        <button id="loc-daily-stats-btn" onclick="showStatsModal('daily')" data-i18n="game.dailyStats">📊 Daily Stats</button>
        <button id="loc-play-switch-btn" style="display:none"></button>
        <button id="loc-endless-stats-btn" onclick="showStatsModal('endless')" data-i18n="game.endlessStats">📊 Endless Stats</button>
        <button class="btn-modes" onclick="goHome()" style="background:var(--bg-cell); border:1px solid var(--border);" data-i18n="game.backBtn">← Modes</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../../../backend/src/db/database.js"></script>
  <script src="../../../backend/src/db/books_database.js"></script>
  <script src="../../../backend/src/db/locations_database.js"></script>
  <script src="../assets/js/translations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = T(el.dataset.i18n);
      });
    });
  </script>
  <script src="../assets/js/core.js?v=3"></script>
  <script src="../assets/js/tcg-auth.js"></script>
  <script src="../assets/js/location.js"></script>
</body>

</html>
