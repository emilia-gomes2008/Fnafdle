name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Create config.js
        run: |
          cat > frontend/dist/assets/js/config.js << 'EOF'
          window.FNAF_CONFIG = {
            SUPABASE_URL: "https://wgwzxbltdfpftfkyfglj.supabase.co",
            SUPABASE_ANON_KEY: "sb_publishable_Kd-2j1OXlgjdOyvsJvTpWA_v-2oUhG8"
          };
          EOF
          cat frontend/dist/assets/js/config.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - uses: actions/deploy-pages@v4
        id: deployment
