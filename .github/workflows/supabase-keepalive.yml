name: Supabase Keep-Alive

# Supabase free-tier projects auto-pause after ~7 days with no activity.
# This pings the REST API with a trivial read once a day so the project
# never goes idle long enough to be paused. Read-only, uses the public
# anon key, touches no schema — safe to run unattended.

on:
  schedule:
    - cron: '0 6 * * *'   # every day at 06:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_LKEY }}
        run: |
          curl -sf -X GET \
            "$SUPABASE_URL/rest/v1/mp_rooms?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -o /dev/null \
          && echo "Supabase ping OK" \
          || (echo "Supabase ping FAILED" && exit 1)
